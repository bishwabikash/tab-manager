name: Check Chrome Web Store credentials

# Read-only: authenticates and reads the store item. Never uploads or publishes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/check-store-credentials.yml
      - .github/scripts/cws-access-token.sh

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate and read store item
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          : "${EXTENSION_ID:?CHROME_EXTENSION_ID secret is not set}"
          ACCESS_TOKEN=$(.github/scripts/cws-access-token.sh)
          echo "Authenticated with Google."

          ITEM=$(curl -sS "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}?projection=DRAFT" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2")
          echo "Store item: $ITEM"

          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "$ITEM" | MANIFEST_VERSION="$MANIFEST_VERSION" python3 -c '
          import json, os, sys
          r = json.load(sys.stdin)
          problem = r.get("error") or r.get("itemError")
          if problem:
              print(f"::error::Could not read the store item: {problem}")
              sys.exit(1)
          store = r.get("crxVersion", "unknown")
          local = os.environ["MANIFEST_VERSION"]
          print(f"::notice::Credentials OK. Store version: {store}. manifest.json version: {local}.")
          if store != "unknown":
              parse = lambda v: tuple(int(p) for p in v.split("."))
              if parse(local) <= parse(store):
                  print(f"::warning::manifest.json version {local} must be higher than the store version {store} before publishing.")
          '
