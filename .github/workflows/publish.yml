# ============================================================
# Tab Manager Pro — Chrome Web Store Publish Workflow
# ============================================================
#
# Publishes with the Chrome Web Store API v2. GitHub signs in to
# Google Cloud through Workload Identity Federation as a service
# account, so no long-lived Google credentials are stored.
#
# REPOSITORY VARIABLES (Settings → Secrets and variables → Actions
# → Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER — projects/<number>/locations/global/
#                                    workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT            — service account email; it must be added
#                                    in the Chrome Web Store Developer
#                                    Dashboard under Account
#   CWS_PUBLISHER_ID               — Publisher ID from the Developer Dashboard
#
# REPOSITORY SECRET:
#   CHROME_EXTENSION_ID            — the extension's store ID
#
# Runs on version-tag pushes only (the post-commit hook pushes
# them from main). Check access without publishing by running the
# "Check Chrome Web Store access" workflow.
# ============================================================

name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

# Never run two publishes for the same tag at once.
concurrency:
  group: cws-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/verify-release-tag.sh

  test:
    needs: verify
    uses: ./.github/workflows/test.yml

  publish:
    name: Build & publish extension
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Zip only the extension source files. Dev/meta files
      # (.github, *.md, store-screenshots, description.txt,
      # *.workspace, screenshots) are intentionally excluded.
      - name: Build extension zip
        run: |
          zip -r extension.zip \
            background.js \
            manifest.json \
            options.html \
            options.js \
            popup.css \
            popup.html \
            popup.js \
            welcome.html \
            welcome.js \
            icons/

      # Verify the zip was created and show its contents as a
      # sanity check in the workflow log.
      - name: Verify zip contents
        run: unzip -l extension.zip

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload & publish to Chrome Web Store
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          node .github/scripts/cws.mjs status --require-newer
          node .github/scripts/cws.mjs upload extension.zip
          node .github/scripts/cws.mjs publish
