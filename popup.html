<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Manager Pro</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="8" height="8" rx="2" fill="currentColor" opacity="0.8" />
                    <rect x="14" y="2" width="8" height="8" rx="2" fill="currentColor" opacity="0.6" />
                    <rect x="2" y="14" width="8" height="8" rx="2" fill="currentColor" opacity="0.6" />
                    <rect x="14" y="14" width="8" height="8" rx="2" fill="currentColor" opacity="0.4" />
                </svg>
                <h1>Tab Manager Pro</h1>
            </div>
            <div class="header-right">
                <div class="tab-count" id="tabCount">0 tabs</div>
                <button class="btn btn-secondary theme-toggle-btn" id="themeToggleBtn" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
                    <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav" role="tablist" aria-label="Main navigation">
            <button class="tab-nav-btn active" data-tab="tabs" role="tab" aria-selected="true" aria-controls="tabsPanel" id="navTabs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
                Tabs
            </button>
            <button class="tab-nav-btn" data-tab="history" role="tab" aria-selected="false" aria-controls="historyPanel" id="navHistory">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12,6 12,12 16,14" />
                </svg>
                History
            </button>
        </nav>

        <!-- Tabs Panel -->
        <div class="tab-panel active" id="tabsPanel" role="tabpanel" aria-labelledby="navTabs">
            <!-- Search Bar -->
            <div class="search-section">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                    <input type="search" id="searchInput" class="search-input" placeholder="Search tabs..." aria-label="Search tabs">
                    <button class="search-clear" id="searchClear" style="display: none;" title="Clear search" aria-label="Clear search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="actions">
                <div class="action-buttons">
                    <button class="btn btn-secondary" id="groupAllBtn" title="Group all tabs" aria-label="Group all tabs">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </button>
                    <button class="btn btn-secondary" id="ungroupAllBtn" title="Ungroup all tabs" aria-label="Ungroup all tabs">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14" />
                        </svg>
                    </button>
                    <button class="btn btn-secondary" id="findDuplicatesBtn" title="Find duplicate tabs" aria-label="Find duplicate tabs">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="8" y="8" width="12" height="12" rx="2" />
                            <path d="M4 16V4h12" />
                        </svg>
                    </button>
                </div>

                <label class="toggle-label" title="Auto-group new tabs">
                    <span class="toggle-text">Auto-group</span>
                    <input type="checkbox" id="autoGroupToggle" class="toggle-input" aria-label="Auto-group new tabs">
                    <span class="toggle-switch"></span>
                </label>
            </div>

            <!-- Duplicates Section (hidden by default) -->
            <section class="duplicates-section" id="duplicatesSection" style="display: none;">
                <div class="section-header">
                    <h2>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="8" y="8" width="12" height="12" rx="2" />
                            <path d="M4 16V4h12" />
                        </svg>
                        Duplicates
                        <span class="duplicate-count" id="duplicateCount">0</span>
                    </h2>
                    <button class="btn-text" id="closeDuplicatesBtn">Close All</button>
                </div>
                <div class="duplicate-list" id="duplicateList"></div>
            </section>

            <!-- Tab Groups Section -->
            <section class="tabs-section">
                <div id="domainList" class="domain-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading tabs...
                    </div>
                </div>
            </section>
        </div>

        <!-- History Panel -->
        <div class="tab-panel" id="historyPanel" role="tabpanel" aria-labelledby="navHistory">
            <section class="history-section">
                <div class="section-header">
                    <h2>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12,6 12,12 16,14" />
                        </svg>
                        Recently Closed
                    </h2>
                </div>
                <div class="tab-list" id="recentlyClosedList">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 8v4M12 16h.01" />
                        </svg>
                        <p>No recently closed tabs</p>
                    </div>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="shortcuts" id="shortcuts" hidden></div>
            <a href="https://www.buymeacoffee.com/nobodybutheader" target="_blank" class="bmc-button">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M20.216 6.415l-.132-.666c-.119-.596-.388-1.163-1.001-1.379-.197-.069-.42-.098-.57-.241-.152-.143-.196-.366-.231-.572-.065-.378-.125-.756-.192-1.133-.057-.325-.102-.69-.25-.987-.195-.4-.597-.634-.996-.788a5.723 5.723 0 00-.626-.194c-1-.263-2.05-.36-3.077-.416a25.834 25.834 0 00-3.7.062c-.915.083-1.88.256-2.75.582-.395.148-.758.384-1.026.711-.272.33-.377.74-.52.923-.217.276-.412.019-.623-.11-.295-.179-.672-.259-1.026-.2C2.705 2.112 2.1 2.65 2 3.409c-.048.37.108.728.324 1.03.116.162.245.312.38.452.336.35.7.674 1.053 1.012a6.9 6.9 0 011.082 1.543c.189.52.288 1.066.302 1.618.006.27.017.54.04.81.047.534.135 1.065.297 1.58.29.921.82 1.765 1.666 2.308.736.473 1.585.736 2.455.776.326.014.653-.01.977-.04.435-.042.87-.1 1.305-.157.653-.086 1.306-.174 1.961-.225.293-.023.585-.05.879-.065.378-.02.755-.043 1.135.034.37.075.722.256 1.077.412.356.155.76.241 1.144.13 1.334-.384 2.227-1.464 2.502-2.774.156-.74.14-1.507.135-2.261-.004-.543-.022-1.086-.063-1.628-.02-.27-.044-.54-.076-.81zm-5.542 4.414l-.063.297c-.035.166-.082.33-.146.488-.13.315-.36.568-.679.673-.42.138-.876.082-1.302.062a7.66 7.66 0 00-1.868.08c-.718.106-1.417.33-2.09.626l-.423.185c-.255.112-.533.208-.813.203-.277-.005-.55-.102-.76-.297a.9.9 0 01-.26-.526c-.053-.404-.017-.824.062-1.222.184-.93.684-1.783 1.396-2.434.693-.633 1.554-1.05 2.484-1.187 1.085-.16 2.193-.03 3.232.327.34.117.65.293.926.541.272.244.475.56.545.922.052.266.023.541-.01.81-.03.26-.057.518-.09.776-.04.32-.086.64-.132.955z" />
                </svg>
                <span>Buy me a coffee</span>
            </a>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>

</html>
